name: G8 Kernel Build

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: false
        default: 'release'
        type: choice
        options:
          - release
          - debug
   branches:
      - publicandroid

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: publicandroid

      - name: Cache Clang toolchain
        id: cache-clang
        uses: actions/cache@v4
        with:
          path: tool
          key: clang-23.0.0git-20260130-${{ runner.os }}

      - name: Download and extract Clang toolchain
        if: steps.cache-clang.outputs.cache-hit != 'true'
        run: |
          echo "Downloading Clang toolchain..."
          wget https://github.com/ZyCromerZ/Clang/releases/download/23.0.0git-20260130-release/Clang-23.0.0git-20260130.tar.gz
          echo "Extracting Clang toolchain..."
          mkdir -p tool
          tar -xzf Clang-23.0.0git-20260130.tar.gz -C tool --strip-components=1
          rm -f Clang-23.0.0git-20260130.tar.gz
          echo "Clang toolchain extracted to tool/"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache gcc-aarch64-linux-gnu g++-aarch64-linux-gnu gcc-arm-linux-gnueabi g++-arm-linux-gnueabi cmake ninja-build llvm

      - name: Build kernel
        run: |
          echo "Building kernel..."
          cd /home/runner/work/kernel_lge_sm8150/kernel_lge_sm8150
          git config --global user.name "Your Name"
          git config --global user.email "your.email@example.com"
          git submodule init
          git submodule update --recursive --remote
          export ARCH=arm64
          export SUBARCH=arm64
          export CLANG_PATH=${{ github.workspace }}/tool/bin
          export PATH=${{ github.workspace }}/tool/bin:${PATH}
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export CLANG_TRIPLE=aarch64-linux-gnu-
          make CC="ccache clang" AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip O=out alpha_defconfig
          make -j$(nproc) CC="ccache clang" AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip O=out

      - name: Package kernel
        run: |
          if [ -f "out/arch/arm64/boot/Image" ]; then
            cp out/arch/arm64/boot/Image anykernel3/
            cp out/arch/arm64/boot/dtbo.img anykernel3/
            cd anykernel3
            CURRENT_TIME=$(date +"%Y%m%d-%H%M")
            zip -r9 AnyKernel3-G8-4.14-V4-"$CURRENT_TIME".zip * -x .git README.md
            cd ..
            echo "Build completed successfully!"
          else
            echo "Image not found. Compilation failed."
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: G8-kernel-zip
          path: anykernel3/AnyKernel3-G8-*.zip
          retention-days: 30
